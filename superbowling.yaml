name: Super Bowling (North America)
sha1: 56937a9e9536af55ebed06480413265848c4a04a
options:
  basename: superbowling
  target_path: rom.z64
  elf_path: build/superbowling.elf
  base_path: .
  platform: n64
  compiler: KMC

  # asm_path: asm
  # src_path: src
  # build_path: build
  # create_asm_dependencies: True

  ld_script_path: superbowling.ld
  ld_dependencies: True

  find_file_boundaries: True
  header_encoding: ASCII

  o_as_suffix: True
  use_legacy_include_asm: False
  mips_abi_float_regs: o32

  # section_order: [".text", ".data", ".rodata", ".bss"]
  # auto_link_sections: [".data", ".rodata", ".bss"]

  symbol_addrs_path:
    - symbol_addrs.txt
  reloc_addrs_path:
    - reloc_addrs.txt

  undefined_funcs_auto_path: undefined_funcs_auto.txt
  undefined_syms_auto_path: undefined_syms_auto.txt

  extensions_path: tools/splat_ext

  # string_encoding: ASCII
  # data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
  libultra_symbols: True
  # hardware_regs: True
  gfx_ucode: f3dex
segments:
  - name: header
    type: header
    start: 0x0

  - name: ipl3
    type: bin
    start: 0x40

  - name: entry
    type: code
    start: 0x1000
    vram: 0x80025C00
    subsegments:
      - [0x1000, hasm]

  - name: main
    type: code
    start: 0x1060
    vram: 0x80025C60
    follows_vram: entry
    bss_size: 0xA91E0
    subsegments:
      - [0x1060, asm]
      - [0x32150, data]
      - { type: bss, vram: 0x80060EA0 }

  # BW64FAT file table: {name, romStart, romEnd, 0} entries; loaded at boot right after main's bss.
  - name: fat
    type: code
    start: 0x3C2A0
    vram: 0x8010A080
    subsegments:
      - [0x3C2A0, data]

  - name: knstatic
    type: code
    start: 0x3C470
    vram: 0x8010A250
    subsegments:
      - [0x3C470, data]

  # Code overlays: all load into the same slot at 0x80112350.
  - name: gacode
    type: code
    start: 0x3C570
    vram: 0x80112350
    exclusive_ram_id: ovl
    symbol_name_format: $VRAM_$SEG
    subsegments:
      - [0x3C570, asm]
      - [0x4D820, data]

  - name: rscode
    type: code
    start: 0x56FF0
    vram: 0x80112350
    exclusive_ram_id: ovl
    symbol_name_format: $VRAM_$SEG
    subsegments:
      - [0x56FF0, asm]
      - [0x58EF0, data]

  - name: gscode
    type: code
    start: 0x58F40
    vram: 0x80112350
    exclusive_ram_id: ovl
    symbol_name_format: $VRAM_$SEG
    subsegments:
      - [0x58F40, asm]
      - [0x62130, data]

  - name: cacode
    type: code
    start: 0x67370
    vram: 0x80112350
    exclusive_ram_id: ovl
    symbol_name_format: $VRAM_$SEG
    subsegments:
      - [0x67370, asm]
      - [0x6A380, data]

  - name: pvcode
    type: code
    start: 0x6A650
    vram: 0x80112350
    exclusive_ram_id: ovl
    symbol_name_format: $VRAM_$SEG
    subsegments:
      - [0x6A650, asm]
      - [0x6A950, data]

  - name: mgcode
    type: code
    start: 0x6BA90
    vram: 0x80112350
    exclusive_ram_id: ovl
    symbol_name_format: $VRAM_$SEG
    subsegments:
      - [0x6BA90, asm]
      - [0x6BC90, data]

  - name: opcode
    type: code
    start: 0x6BE70
    vram: 0x80112350
    exclusive_ram_id: ovl
    symbol_name_format: $VRAM_$SEG
    subsegments:
      - [0x6BE70, asm]
      - [0x6DBD0, data]

  - name: idx
    type: bin
    start: 0x6DE70

  - name: str
    type: bin
    start: 0x767E0

  - name: bgmptr
    type: bin
    start: 0x3D60F0

  - name: bgmwbk
    type: bin
    start: 0x3DADF0

  - name: septr
    type: bin
    start: 0x4D8190

  - name: sewbk
    type: bin
    start: 0x4DB6C0

  - name: bfx
    type: bin
    start: 0x655AD0

  - name: pad
    type: bin
    start: 0x656CD0

  - [0x800000]
