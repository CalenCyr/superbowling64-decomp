  # BW64FAT file table: {name, romStart, romEnd, 0} entries; loaded at boot right after main's bss.
  - name: fat
    type: code
    start: 0x3C2A0
    vram: 0x8010A080
    subsegments:
      - [0x3C2A0, data]

  - name: knstatic
    type: code
    start: 0x3C470
    vram: 0x8010A250
    subsegments:
      - [0x3C470, data]

  # Code overlays: all load into the same slot at 0x80112350.
  - name: gacode
    type: code
    start: 0x3C570
    vram: 0x80112350
    exclusive_ram_id: ovl
    symbol_name_format: $VRAM_$SEG
    subsegments:
      - [0x3C570, c, gacode/3C570]
      - [0x3E350, c, gacode/3E350]
      - [0x474E0, c, gacode/474E0]
      - [0x4C560, c, gacode/4C560]
      - [0x4D820, data]

